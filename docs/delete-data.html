<body><nav class="top"><div class="wrap"><a href="index.html">← Tuition Khata</a></div></nav><main class="wrap"><div class="doc"><h1>Delete your data</h1>
<p>Tuition Khata has no accounts and no servers. All data exists only on your phone. To delete it: open Android Settings → Apps → Tuition Khata → Storage → <strong>Clear storage</strong>, or simply uninstall the app. We hold no copy of your data.</p></div></main></body></html>
